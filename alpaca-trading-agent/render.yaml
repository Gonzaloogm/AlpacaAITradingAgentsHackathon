services:
  - type: web
    name: alpaca-agent-backend
    env: docker
    dockerContext: ./alpaca-trading-agent
    dockerfilePath: ./alpaca-trading-agent/backend/Dockerfile
    plan: free
    envVars:
      - key: ALPACA_API_KEY
        sync: false
      - key: ALPACA_SECRET_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
    # Optional health check
    healthCheckPath: /health

  - type: web
    name: alpaca-agent-frontend
    env: docker
    dockerContext: ./alpaca-trading-agent/frontend
    dockerfilePath: ./alpaca-trading-agent/frontend/Dockerfile
    plan: free
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: alpaca-agent-backend
          envVarKey: RENDER_EXTERNAL_URL
