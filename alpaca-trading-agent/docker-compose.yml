services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - ALPACA_API_KEY=${ALPACA_API_KEY}
      - ALPACA_SECRET_KEY=${ALPACA_SECRET_KEY}
      - ALPACA_PAPER_TRADE=${ALPACA_PAPER_TRADE:-true}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - STRATEGY_NAME=${STRATEGY_NAME:-pairs_trading}
      - HOST=0.0.0.0
      - PORT=8000
    ports:
      - "8000:8000"
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://agent:8000
    depends_on:
      - agent
